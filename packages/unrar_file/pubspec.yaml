name: unrar_file
description: Vendored unrar_file with Android build compatibility fixes.
version: 1.1.0
publish_to: none
homepage: https://github.com/syedecryptr/unrar_file

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0

flutter:
  plugin:
    platforms:
      android:
        package: com.syed.unrar_file
        pluginClass: UnrarFilePlugin
      ios:
        pluginClass: UnrarFilePlugin
