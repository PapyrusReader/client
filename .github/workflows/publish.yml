name: Publish signed client downloads
run-name: Publish ${{ inputs.manifest }}
on:
  workflow_dispatch:
    inputs:
      manifest:
        required: true
        type: string
      build_run:
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-client-downloads
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    environment: release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST: ${{ inputs.manifest }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized workspace and build provenance
        id: release
        run: |
          set -euo pipefail
          [[ "$MANIFEST" =~ ^[0-9a-f]{40}$ && "$BUILD_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api repos/PapyrusReader/papyrus/git/ref/heads/master --jq .object.sha)" = "$MANIFEST"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          jq -e --arg title "Build client $MANIFEST" '.path == ".github/workflows/release.yml" and .head_branch == "master" and .event == "workflow_dispatch" and .conclusion == "success" and .display_title == $title' <<< "$run" >/dev/null
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/PapyrusReader/papyrus/contents/release.json?ref=$MANIFEST" > "$RUNNER_TEMP/manifest.json"
          tag=$(jq -er 'select(.orchestrator == "octopus") | "v\(.version)+\(.android_build_number)"' "$RUNNER_TEMP/manifest.json")
          revision=$(gh api "repos/PapyrusReader/papyrus/git/trees/$MANIFEST" --jq '.tree[] | select(.path == "client" and .mode == "160000") | .sha')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "REVISION=$revision" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: sealed-release
          path: artifacts
      - name: Verify and publish original signed artifacts
        run: python3 tools/release_assets.py publish artifacts --tag "$TAG" --revision "$REVISION"
