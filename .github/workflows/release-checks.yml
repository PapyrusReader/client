name: Release configuration checks

on:
  pull_request:
    paths: ['tools/**', '.github/workflows/**', 'app/pubspec.yaml', 'app/android/**', 'app/lib/updates/**', 'app/linux/**', 'app/windows/**', 'packaging/**', 'packages/**']
  push:
    branches: [development, master]
    paths: ['tools/**', '.github/workflows/**', 'app/pubspec.yaml', 'app/android/**', 'app/lib/updates/**', 'app/linux/**', 'app/windows/**', 'packaging/**', 'packages/**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v

  android-updates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [play, direct]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter build apk --debug --flavor ${{ matrix.flavor }} --no-pub
        working-directory: app
      - name: Check distribution permissions
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          manifest=$(find app/build/app/intermediates/merged_manifests -path "*/${FLAVOR}Debug/*/AndroidManifest.xml" -print -quit)
          python tools/check_android_distribution.py "$manifest" --flavor "$FLAVOR"
