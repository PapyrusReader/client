name: Reader journeys and recovery

on:
  pull_request:
    branches: [development, master]
    paths: ['app/**', 'tools/*resilience*', 'tools/mobile_journey.sh', 'tools/run_sync_fault.sh', 'tools/test_browser_history.py', '.github/scripts/select_journeys.sh', '.github/workflows/resilience.yml']
  schedule:
    - cron: '19 2 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Optional seed for replay
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'
  JOURNEY_SEED: ${{ inputs.seed || (github.event_name == 'schedule' && github.run_id) || '42' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
      history: ${{ steps.paths.outputs.history }}
      sync: ${{ steps.paths.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE...$HEAD_SHA" | bash .github/scripts/select_journeys.sh >> "$GITHUB_OUTPUT"
          else
            printf 'android=full\nhistory=true\nsync=true\n' >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  history:
    needs: select
    if: needs.select.outputs.history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --profile --no-pub
      - run: uv run --script tools/test_browser_history.py app/build/web

  sync:
    needs: select
    if: needs.select.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PapyrusReader/server
          ref: 8af9febeb846f120c28be91fb2ee905dc52018c5
          path: server
      - uses: astral-sh/setup-uv@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Toxiproxy
        run: |
          curl -fsSL --retry 3 https://github.com/Shopify/toxiproxy/releases/download/v2.13.0/toxiproxy-server-linux-amd64 -o "$RUNNER_TEMP/toxiproxy-server"
          echo 'bf529e8bb9a05cd293f45a3f1d0aa66ff9469680dcdca7e0ebeae21f1b83de89  toxiproxy-server' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          chmod +x "$RUNNER_TEMP/toxiproxy-server"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: tools/run_sync_fault.sh server

  android:
    needs: select
    if: needs.select.outputs.android != 'none'
    env:
      JOURNEY_SUITE: ${{ needs.select.outputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: |
          flutter pub get --enforce-lockfile
          dart pub global activate patrol_cli 4.10.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        working-directory: app
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: tools/mobile_journey.sh emulator-5554
      - if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: |
            (cd app && flutter build apk --debug --flavor direct)
            adb -s emulator-5554 install app/build/app/outputs/flutter-apk/app-direct-debug.apk
            uv run --script tools/android_resilience.py --device emulator-5554 --seed "$JOURNEY_SEED" --output app/build/resilience
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-resilience-${{ github.run_attempt }}
          path: |
            app/build/resilience
            app/build/app/reports/androidTests

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: |
          flutter pub get --enforce-lockfile
          dart pub global activate patrol_cli 4.10.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        working-directory: app
      - name: Run reader journey on a fresh iPhone
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          tools/mobile_journey.sh "$device"
          cd app
          flutter build ios --debug --config-only --simulator --target integration_test/support/timer_notification_app.dart
          cd ios
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$device" -only-testing:RunnerTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ../build/timer-derived -resultBundlePath ../build/timer.xcresult \
            FLUTTER_TARGET=integration_test/support/timer_notification_app.dart
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-journey-results-${{ github.run_attempt }}
          path: app/build/*.xcresult
