name: Release

on:
  push:
    branches: [master]
    paths: ['app/pubspec.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.2'

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - name: Check committed version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python tools/release_gate.py client --manual
          else
            python tools/release_gate.py client --base "$BEFORE"
          fi

  build-android:
    needs: version
    if: needs.version.outputs.release == 'true'
    environment: release
    runs-on: ubuntu-latest
    env:
      PAPYRUS_API_BASE_URL: ${{ vars.PAPYRUS_API_BASE_URL }}
      POWERSYNC_SERVICE_URL: ${{ vars.POWERSYNC_SERVICE_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set temporary keystore path
        run: printf 'ANDROID_KEYSTORE_PATH=%s/upload.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Validate endpoints and restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python ../tools/release_gate.py client --endpoints
          test -n "$KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo "Configure the Android upload-key secrets in the release environment"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build signed Google Play bundle
        run: |
          flutter build appbundle --release \
            --dart-define=PAPYRUS_API_BASE_URL="$PAPYRUS_API_BASE_URL" \
            --dart-define=POWERSYNC_SERVICE_URL="$POWERSYNC_SERVICE_URL"
      - name: Check 16 KB native and bundle alignment
        run: |
          python ../tools/check_android_bundle.py build/app/outputs/bundle/release/app-release.aab
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          printf 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  %s/bundletool.jar\n' "$RUNNER_TEMP" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle=build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-config.json"
          python -c 'import json, os; from pathlib import Path; config = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bundle-config.json").read_text()); assert config["optimizations"]["uncompressNativeLibraries"]["alignment"] == "PAGE_ALIGNMENT_16K", "Bundle must request 16 KB APK alignment"'
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove upload key
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -f "$RUNNER_TEMP/upload.jks"

  build-web:
    name: Build Web
    needs: version
    if: needs.version.outputs.release == 'true'
    environment: release
    env:
      PAPYRUS_API_BASE_URL: ${{ vars.PAPYRUS_API_BASE_URL }}
      POWERSYNC_SERVICE_URL: ${{ vars.POWERSYNC_SERVICE_URL }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate release configuration
        run: python ../tools/release_gate.py client --endpoints

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=PAPYRUS_API_BASE_URL="${PAPYRUS_API_BASE_URL}" \
            --dart-define=POWERSYNC_SERVICE_URL="${POWERSYNC_SERVICE_URL}" \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Create archive
        run: |
          cd build/web
          zip -r ../../papyrus-web-v${{ needs.version.outputs.version }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: app/papyrus-web-v${{ needs.version.outputs.version }}.zip

  build-linux:
    name: Build Linux
    needs: version
    if: needs.version.outputs.release == 'true'
    environment: release
    env:
      PAPYRUS_API_BASE_URL: ${{ vars.PAPYRUS_API_BASE_URL }}
      POWERSYNC_SERVICE_URL: ${{ vars.POWERSYNC_SERVICE_URL }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate release configuration
        run: python ../tools/release_gate.py client --endpoints

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: |
          flutter build linux --release \
            --dart-define=PAPYRUS_API_BASE_URL="${PAPYRUS_API_BASE_URL}" \
            --dart-define=POWERSYNC_SERVICE_URL="${POWERSYNC_SERVICE_URL}" \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Create archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../papyrus-linux-v${{ needs.version.outputs.version }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: app/papyrus-linux-v${{ needs.version.outputs.version }}.tar.gz

  build-windows:
    name: Build Windows
    needs: version
    if: needs.version.outputs.release == 'true'
    environment: release
    env:
      PAPYRUS_API_BASE_URL: ${{ vars.PAPYRUS_API_BASE_URL }}
      POWERSYNC_SERVICE_URL: ${{ vars.POWERSYNC_SERVICE_URL }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate release configuration
        run: python ../tools/release_gate.py client --endpoints

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        run: |
          flutter build windows --release `
            --dart-define=PAPYRUS_API_BASE_URL="$env:PAPYRUS_API_BASE_URL" `
            --dart-define=POWERSYNC_SERVICE_URL="$env:POWERSYNC_SERVICE_URL" `
            --build-name=${{ needs.version.outputs.version }} `
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Create archive
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath papyrus-windows-v${{ needs.version.outputs.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: app/papyrus-windows-v${{ needs.version.outputs.version }}.zip

  release:
    needs: [version, build-android, build-web, build-linux, build-windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Papyrus ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
